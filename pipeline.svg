<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">
  <title>JobMatchAI Pipeline Architecture</title>
  <desc>End-to-end pipeline: resume upload → 15 job boards → seen-jobs filter → AI scoring → tailoring → email delivery</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#161b22"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#21262d" stroke-width="1"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="24" r="6" fill="#27c93f"/>
  <text x="600" y="30" fill="#8b949e" font-size="13" text-anchor="middle" letter-spacing="3">J O B M A T C H A I   ·   P I P E L I N E   A R C H I T E C T U R E</text>

  <!-- STAGE 1: User Input -->
  <rect x="30" y="80" width="140" height="80" rx="8" fill="#1c2128" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="108" fill="#3b82f6" font-size="11" text-anchor="middle" letter-spacing="1">USER INPUT</text>
  <text x="100" y="128" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">Resume</text>
  <text x="100" y="145" fill="#8b949e" font-size="10" text-anchor="middle">PDF · DOCX · TXT</text>

  <line x1="170" y1="120" x2="210" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 2: Job Fetching -->
  <rect x="210" y="68" width="170" height="104" rx="8" fill="#1c2128" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="295" y="92" fill="#06b6d4" font-size="11" text-anchor="middle" letter-spacing="1">JOB FETCHING</text>
  <text x="295" y="112" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">15 Sources</text>
  <text x="295" y="130" fill="#8b949e" font-size="10" text-anchor="middle">in parallel</text>
  <line x1="260" y1="148" x2="280" y2="148" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="153" x2="285" y2="153" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>
  <line x1="260" y1="158" x2="290" y2="158" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
  <text x="296" y="159" fill="#06b6d4" font-size="9" opacity="0.8">ThreadPoolExecutor</text>
  <text x="218" y="108" fill="#0e7490" font-size="8">Adzuna · USAJobs</text>
  <text x="218" y="120" fill="#0e7490" font-size="8">Jooble · FindWork</text>
  <text x="218" y="132" fill="#0e7490" font-size="8">+11 more sources</text>

  <line x1="380" y1="120" x2="420" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 3: Dedup Cache -->
  <rect x="420" y="80" width="140" height="80" rx="8" fill="#1c2128" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="490" y="108" fill="#f59e0b" font-size="11" text-anchor="middle" letter-spacing="1">DEDUP CACHE</text>
  <text x="490" y="128" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">New Jobs Only</text>
  <text x="490" y="145" fill="#8b949e" font-size="10" text-anchor="middle">seen_jobs.json · per user</text>

  <line x1="560" y1="120" x2="600" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 4: AI Scoring -->
  <rect x="600" y="68" width="150" height="104" rx="8" fill="#1c2128" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="675" y="92" fill="#a78bfa" font-size="11" text-anchor="middle" letter-spacing="1">AI SCORING</text>
  <text x="675" y="112" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">GPT · 24 threads</text>
  <text x="675" y="130" fill="#8b949e" font-size="10" text-anchor="middle">match threshold filter</text>
  <line x1="640" y1="148" x2="660" y2="148" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="640" y1="153" x2="665" y2="153" stroke="#a78bfa" stroke-width="1" opacity="0.7"/>
  <line x1="640" y1="158" x2="670" y2="158" stroke="#a78bfa" stroke-width="1" opacity="0.9"/>
  <text x="676" y="159" fill="#a78bfa" font-size="9" opacity="0.8">parallel workers</text>

  <line x1="750" y1="120" x2="790" y2="120" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- STAGE 5: Tailoring -->
  <rect x="790" y="68" width="150" height="104" rx="8" fill="#1c2128" stroke="#818cf8" stroke-width="1.5"/>
  <text x="865" y="88" fill="#818cf8" font-size="10" text-anchor="middle" letter-spacing="1">AI TAILORING</text>
  <text x="865" y="106" fill="#e6edf3" font-size="11" text-anchor="middle" font-weight="600">Resume · ATS</text>
  <text x="865" y="122" fill="#e6edf3" font-size="11" text-anchor="middle" font-weight="600">Cover Letter</text>
  <text x="865" y="140" fill="#8b949e" font-size="9" text-anchor="middle">parallel per job</text>
  <text x="865" y="155" fill="#8b949e" font-size="9" text-anchor="middle">ReportLab → PDF</text>
  <line x1="830" y1="162" x2="850" y2="162" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <line x1="830" y1="167" x2="855" y2="167" stroke="#818cf8" stroke-width="1" opacity="0.9"/>

  <line x1="940" y1="120" x2="980" y2="120" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- STAGE 6: Email -->
  <rect x="980" y="80" width="170" height="80" rx="8" fill="#1c2128" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="108" fill="#34d399" font-size="11" text-anchor="middle" letter-spacing="1">DELIVERY</text>
  <text x="1065" y="128" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">Email + PDFs</text>
  <text x="1065" y="145" fill="#8b949e" font-size="10" text-anchor="middle">Resend API · HTTPS</text>

  <!-- Divider -->
  <rect x="30" y="210" width="1140" height="1" fill="#21262d"/>
  <text x="600" y="240" fill="#8b949e" font-size="10" text-anchor="middle" letter-spacing="2">M U L T I - U S E R   A R C H I T E C T U R E</text>

  <!-- User A card -->
  <rect x="80" y="260" width="290" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <rect x="80" y="260" width="290" height="28" rx="8" fill="#1f2937"/>
  <rect x="80" y="278" width="290" height="10" rx="0" fill="#1f2937"/>
  <circle cx="100" cy="274" r="6" fill="#3b82f6" opacity="0.8"/>
  <text x="115" y="278" fill="#e6edf3" font-size="11" font-weight="600">User A  ·  alice@gmail.com</text>
  <text x="96" y="305" fill="#8b949e" font-size="10">user_data/alice_gmail_com/</text>
  <text x="96" y="320" fill="#475569" font-size="9">├── resume.txt</text>
  <text x="96" y="333" fill="#475569" font-size="9">├── seen_jobs.json</text>
  <text x="96" y="346" fill="#475569" font-size="9">└── output/  (30 PDFs)</text>
  <text x="96" y="360" fill="#3b82f6" font-size="9">run_id: a1b2c3...  →  /api/status?run_id=a1b2...</text>

  <text x="600" y="310" fill="#8b949e" font-size="9" text-anchor="middle">simultaneous</text>
  <text x="600" y="322" fill="#8b949e" font-size="9" text-anchor="middle">isolated</text>
  <text x="600" y="334" fill="#8b949e" font-size="9" text-anchor="middle">runs</text>

  <!-- User B card -->
  <rect x="830" y="260" width="290" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <rect x="830" y="260" width="290" height="28" rx="8" fill="#1f2937"/>
  <rect x="830" y="278" width="290" height="10" rx="0" fill="#1f2937"/>
  <circle cx="850" cy="274" r="6" fill="#34d399" opacity="0.8"/>
  <text x="865" y="278" fill="#e6edf3" font-size="11" font-weight="600">User B  ·  bob@gmail.com</text>
  <text x="846" y="305" fill="#8b949e" font-size="10">user_data/bob_gmail_com/</text>
  <text x="846" y="320" fill="#475569" font-size="9">├── resume.txt</text>
  <text x="846" y="333" fill="#475569" font-size="9">├── seen_jobs.json</text>
  <text x="846" y="346" fill="#475569" font-size="9">└── output/  (22 PDFs)</text>
  <text x="846" y="360" fill="#34d399" font-size="9">run_id: f9e8d7...  →  /api/status?run_id=f9e8...</text>

  <!-- Tech legend -->
  <rect x="30" y="400" width="1140" height="1" fill="#21262d"/>
  <text x="70"   y="428" fill="#3b82f6" font-size="10">● Flask + Gunicorn</text>
  <text x="200"  y="428" fill="#06b6d4" font-size="10">● 15 Job Board APIs</text>
  <text x="350"  y="428" fill="#a78bfa" font-size="10">● OpenAI GPT</text>
  <text x="470"  y="428" fill="#f59e0b" font-size="10">● Seen-Jobs Cache</text>
  <text x="610"  y="428" fill="#818cf8" font-size="10">● ReportLab PDFs</text>
  <text x="740"  y="428" fill="#34d399" font-size="10">● Resend API</text>
  <text x="855"  y="428" fill="#8b949e" font-size="10">● Python ThreadPoolExecutor · 24 workers</text>

  <!-- Bottom bar -->
  <rect x="0" y="450" width="1200" height="70" fill="#0d1117"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#21262d" stroke-width="1"/>
  <text x="600" y="478" fill="#30363d" font-size="10" text-anchor="middle" letter-spacing="2">DEPLOYED ON RENDER  ·  GITHUB CI/CD AUTO-DEPLOY  ·  MULTI-USER  ·  IPv4-FORCE PATCH FOR CLOUD</text>
  <text x="600" y="500" fill="#3b82f6" font-size="11" text-anchor="middle" letter-spacing="1">github.com/bachanagoninagesh/JobMatchAI</text>
</svg>
